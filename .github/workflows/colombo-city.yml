name: Colombo city development
on:
  push:
    branches: [colombo-city]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: colombo-city-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned toolchain
        shell: pwsh
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.2.1
          ./tools/setup_windows.ps1
      - name: Protect released geometry
        run: python tools/colombo_baseline.py
      - name: Validate regression suite
        shell: pwsh
        run: ./tools/check_local2player.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LeoRacer-colombo-city-checks
          path: docs/qa-colombo-city/
          retention-days: 14
