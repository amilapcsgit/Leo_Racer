name: Windows 2.7 Ultra validation and packages
on:
  push:
    branches: ['2.7-ultra', 'release/2.7.*']
    tags: ['v2.7.*']
  pull_request:
    branches: ['main', 'lighting', '2.7-ultra', 'release/2.7.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ultra-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and tag versions
        shell: pwsh
        run: |
          $version=[regex]::Match((Get-Content project.godot -Raw),'config/version="([^"]+)"').Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {throw 'Tag does not match source version'}
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            .tools/dotnet
            .tools/godot
            .tools/templates
            .tools/nuget
            addons/rokojori_action_library
            build/downloads
          key: ultra-tools-content-${{ hashFiles('toolchain-lock.json', 'dependency-lock.json', 'content-baseline-lock.json') }}
      - name: Install checksum-pinned tools
        shell: pwsh
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.2.1
          ./tools/setup_windows.ps1
      - name: Preserve source geometry
        shell: pwsh
        run: |
          python tools/verify_modular_sources.py
          if ($LASTEXITCODE -ne 0) {throw 'Source preservation failed'}
          python tools/verify_bigster_assets.py
          if ($LASTEXITCODE -ne 0) {throw 'Bigster preservation failed'}
      - name: Validate and package from staged content
        shell: pwsh
        run: ./tools/ultra_windows.ps1 -Package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultra-windows-evidence
          path: |
            build/qa270/**
            build/qa-ui/*.json
            dist/release-2.7.0/**
          retention-days: 30
      # Hosted checks do not certify GPU performance or physical controller feel.
