name: Windows build and release
on:
  push:
    branches: ['**', '!local2player']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set build version
        shell: pwsh
        run: |
          $version='1.7.0'
          if ('${{ github.ref_type }}' -eq 'tag') {$version='${{ github.ref_name }}'.TrimStart('v')}
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: |
            .tools/dotnet
            .tools/godot
            .tools/templates
            .tools/nuget
            addons/rokojori_action_library
          key: leo-windows-tools-v2-${{ hashFiles('toolchain-lock.json', 'dependency-lock.json') }}
      - name: Install checksum-pinned dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -m pip install numpy==2.2.6 Pillow==11.2.1
          ./tools/setup_windows.ps1
      - name: Validate source preservation
        shell: pwsh
        run: |
          python tools/verify_modular_sources.py
          if ($LASTEXITCODE -ne 0) {throw 'Stable assets changed'}
          python tools/verify_bigster_assets.py
          if ($LASTEXITCODE -ne 0) {throw 'Dimension or glass validation failed'}
      - name: Validate catalog and gameplay
        shell: pwsh
        run: |
          ./tools/check_local2player.ps1
      - name: Export game and launcher
        shell: pwsh
        run: |
          ./tools/build_modular_release.ps1
          ./tools/build_launcher.ps1 -Version $env:BUILD_VERSION
          python tools/package_modular.py --branch local2player --version $env:BUILD_VERSION
          ./tools/build_installer.ps1 -Version $env:BUILD_VERSION
          python tools/package_modular.py --branch local2player --version $env:BUILD_VERSION --checksums-only
      - name: Verify extracted offline package
        shell: pwsh
        run: |
          $name=if ($env:BUILD_VERSION.Contains('-rc')) {'Leo Racer Bigster RC'} else {'Leo Racer'}
          $folder=Resolve-Path "build/qa-modular-garage-fresh/$name"
          $launcher=Join-Path $folder 'Leo Racer Launcher.exe'
          $p=Start-Process -FilePath $launcher -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0) {throw 'Launcher self-test failed'}
          # Hosted runners have no Vulkan GPU. Hardware Vulkan/GL acceptance is
          # recorded separately in docs/MODULAR_GARAGE_VALIDATION.md.
          $exe=Join-Path $folder 'Leo Racer.exe'
          $p=Start-Process -FilePath $exe -ArgumentList @('--headless','--','--smoke-test') -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0) {throw 'Extracted game smoke test failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*
            docs/qa-modular-garage/*.json
            docs/qa-bigster/*.json
            docs/qa-bigster-replacement/*.json
            docs/qa-local2player/*.json
          retention-days: 14
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/1.7.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then tag="v1.7.0"; fi
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then echo 'Existing tag points to different source; refusing to overwrite it.'; exit 1; fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          if existing=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$existing" == "false" ]]; then echo 'Validated release is already public.'; exit 0; fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Leo Racer $tag" --notes-file docs/RELEASE_NOTES.md --draft
          fi
          gh release upload "$tag" release/dist/* docs/qa-local2player/garage-sheet.jpg docs/qa-local2player/regressions.json docs/qa-local2player/performance-forward_plus.json docs/qa-local2player/performance-gl_compatibility.json --clobber
          if [[ "$tag" == *-rc* ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --latest
          fi
